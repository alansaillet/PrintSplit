# ============================================================================
# Example job -- tiles examples/sample_drawing.pdf
# ----------------------------------------------------------------------------
# Run it with:
#
#     python printsplit.py config/example.toml
#
# The sample is a 2400 x 1200 mm base plate drawn at 1:20 on A4. Printed full
# size it becomes a 2.5 x 1.3 m template across 6 A0 sheets.
#
# Copy this file to start your own job. Only the settings that differ from
# config/default.toml need to appear -- that file documents every one of them.
# ============================================================================

extends = "default.toml"

[project]
name = "Sample base plate"
input = "examples/sample_drawing.pdf"
page = 1
output_dir = "examples/out"
output_basename = "sample_A0_1to1"

[scale]
source_scale = 20.0   # the drawing is 1:20
target_scale = 1.0    # print it full size

[source]
padding_mm = 20.0     # clear paper around the drawing, at print scale

[lines]
# Untouched, a 0.6 pt CAD line would print 12 mm wide at x20. Thin lines are
# also more precise to mark from.
mode = "fixed"
width_mm = 0.5

[sheet]
size = "A0"
orientation = "auto"
margin_mm = 10.0      # your plotter's dead border

[tiling]
overlap_mm = 30.0

[marks.registration]
spacing_mm = 250.0    # a crosshair every 250 mm along each joint
